<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 프리미엄 블랙잭 - 베팅 게임</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <h1>🎰 BLACKJACK</h1>
            <div class="chip-display">
                <span class="chip-icon">💰</span>
                <span class="chip-amount" id="chipAmount">1000</span>
            </div>
        </div>
        <!-- 게임 테이블 -->
        <div class="game-table">
            <!-- 딜러 영역 -->
            <div class="dealer-area">
                <h2>딜러</h2>
                <div class="cards-container dealer-cards" id="dealerCards">
                    <div class="card-slot empty" id="dealerCard1"></div>
                    <div class="card-slot empty" id="dealerCard2"></div>
                </div>
                <div class="score-display">
                    <span id="dealerScore">0</span>
                </div>
            </div>
            <!-- 베팅 및 게임 상태 -->
            <div class="game-status">
                <div id="statusMessage" class="status-message">게임 준비 완료</div>
                <div id="resultMessage" class="result-message"></div>
            </div>
            <!-- 플레이어 영역 -->
            <div class="player-area">
                <h2>플레이어</h2>
                <div class="cards-container player-cards" id="playerCards">
                    <div class="card-slot empty" id="playerCard1"></div>
                    <div class="card-slot empty" id="playerCard2"></div>
                </div>
                <div class="score-display">
                    <span id="playerScore">0</span>
                </div>
            </div>
        </div>
        <!-- 베팅 섹션 -->
        <div class="betting-section" id="bettingSection">
            <h3>💸 베팅액 선택</h3>
            <div class="bet-buttons">
                <button class="bet-btn" data-bet="10">10</button>
                <button class="bet-btn" data-bet="25">25</button>
                <button class="bet-btn" data-bet="50">50</button>
                <button class="bet-btn" data-bet="100">100</button>
                <button class="bet-btn" data-bet="250">250</button>
                <button class="bet-btn" data-bet="500">500</button>
            </div>
            <div class="custom-bet">
                <input type="number" id="customBetInput" placeholder="직접 입력" min="1">
                <button class="bet-btn" id="customBetBtn">베팅</button>
            </div>
            <div class="current-bet">
                현재 베팅: <span id="currentBet" class="bet-amount">0</span>
            </div>
        </div>
        <!-- 게임 컨트롤 -->
        <div class="control-section">
            <button class="btn btn-primary" id="dealBtn">🎴 딜</button>
            <button class="btn btn-secondary" id="hitBtn" disabled>🔄 히트</button>
            <button class="btn btn-secondary" id="standBtn" disabled>⏸️ 스탠드</button>
            <button class="btn btn-danger" id="resetBtn">🔄 새 게임</button>
        </div>
        <!-- 통계 -->
        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">승리</span>
                <span class="stat-value" id="wins">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">패배</span>
                <span class="stat-value" id="losses">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">무승부</span>
                <span class="stat-value" id="draws">0</span>
            </div>
        </div>
    </div>
    <!-- 파티클 효과 -->
    <div class="particles-container" id="particlesContainer"></div>
    <script src="js/deck.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
